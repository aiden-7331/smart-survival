name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit tests
        run: bash gradlew build --stacktrace
      - name: Install software graphics
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Client integration tests
        timeout-minutes: 8
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX +render -noreset" glxinfo -B
          xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX +render -noreset" bash gradlew runClientGameTest --stacktrace
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          SDL_VIDEODRIVER: x11
          ALSOFT_DRIVERS: 'null'
      - name: Summarize tests and screenshots
        if: always()
        run: python3 scripts/verification-report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-survival-build
          path: |
            build/libs/*.jar
            build/reports/tests/
            build/test-results/
            run/clientGameTest/
            run/screenshots/
            run/logs/
            build/run/
          if-no-files-found: warn

