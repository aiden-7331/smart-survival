name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit tests
        run: bash gradlew build --stacktrace
      - name: Client integration tests
        run: xvfb-run -a bash gradlew runClientGameTest --stacktrace
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          SDL_VIDEODRIVER: x11
          ALSOFT_DRIVERS: 'null'
      - name: Verify Minecraft API
        if: always()
        run: bash gradlew apiReport --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-survival-build
          path: |
            build/libs/*.jar
            build/reports/tests/
            build/test-results/
            run/clientGameTest/
            build/run/
          if-no-files-found: warn
